<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event History</title>
    <style>
        /* === Dark theme matching Phase 1 dashboard === */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Top ~65%: Events area ===== */
        #events-area {
            flex: 13;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 1rem 0 0.5rem;
        }

        h1 {
            text-align: center;
            padding: 0 0 0.25rem;
            margin: 0;
            color: #ffffff;
            font-size: 1.5rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #a0a0c0;
            padding-bottom: 0.75rem;
        }

        /* Horizontal scroll container for day groups */
        .days-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        /* Show vertical scrollbar when day content exceeds height (especially with viewer open) */
        .days-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .days-scroll::-webkit-scrollbar-track {
            background: #16213e;
        }
        .days-scroll::-webkit-scrollbar-thumb {
            background: #4a4a6e;
            border-radius: 4px;
        }

        /* Ensure events-area allows children to scroll rather than clipping */
        #events-area {
            flex: 13;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: visible;
            padding: 1rem 0 0.5rem;
        }

        .days-row {
            display: flex;
            gap: 1.5rem;
            padding: 0 1rem;
            width: max-content;
        }
        /* Individual day group */
        .day-group {
            flex-shrink: 0;
            width: 260px;
            display: flex;
            flex-direction: column;
        }

        .day-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #3a3a5e;
            margin-bottom: 0.5rem;
        }

        .day-header .day-num {
            font-size: 1.6rem;
            display: block;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .day-header .month-year {
            font-size: 0.7rem;
            color: #8080a0;
        }

        /* Events within a day (vertical stack) */
        .day-events {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .day-events::-webkit-scrollbar {
            width: 4px;
        }
        .day-events::-webkit-scrollbar-track {
            background: transparent;
        }
        .day-events::-webkit-scrollbar-thumb {
            background: #3a3a5e;
            border-radius: 2px;
        }

        /* Timeline spine (vertical line through day events) */
        .events-spine {
            position: relative;
            padding-left: 1.5rem;
        }

        .events-spine::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #3a3a5e;
        }

        /* Event rows */
        .event-row {
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.25rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.85rem;
        }

        .event-row:hover {
            background: #2a2a4e;
        }

        .event-time {
            font-size: 0.75rem;
            color: #8080a0;
            margin-bottom: 0.15rem;
        }

        /* Animal event card accent — green left border */
        .event-row.animal-event {
            border-left: 3px solid #00e676;
            background: rgba(0, 230, 118, 0.04);
        }

        /* High-priority animal highlight — yellow background */
        .event-row.animal-event.highlight {
            border-left-color: #b8860b;
            background: #FFDB58;
            color: #1a0a00;
        }

        /* Event icon column */
        .event-icon {
            font-size: 1.2rem;
            width: 1.5rem;
            text-align: center;
            flex-shrink: 0;
        }

        .event-icon img.animal-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
        }

        /* Arm action marker — dashed gold border */
        .arm-action {
            background: #2a2a4e;
            border-left: 3px dashed #ffd700;
            padding: 0.4rem 0.75rem;
            cursor: default;
        }

        .arm-action:hover {
            background: #32325e;
        }

        /* Timeline dot for spine alignment */
        .event-dot {
            position: absolute;
            left: 1px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a9eff;
            z-index: 1;
        }

        .arm-action .event-dot {
            background: #ffd700;
        }

        /* Event text */
        .event-animal {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .arm-label {
            font-weight: 600;
            color: #ffd700;
        }

        .img-count {
            font-size: 0.75rem;
            color: #8080a0;
        }

        /* ===== Bottom ~35%: Image viewer ===== */
        #image-viewer {
            flex: 7;
            min-height: 0;
            background: #16213e;
            border-top: 2px solid #3a3a5e;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        /* Total flex = events-area (13) + image-viewer (7) = 20 → viewer gets ~35% */

        #image-viewer.visible {
            display: flex;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #2a2a4e;
            flex-shrink: 0;
        }

        .viewer-header h3 {
            font-size: 0.9rem;
            color: #a0a0c0;
            font-weight: 600;
        }

        .viewer-close {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 0.25rem;
            line-height: 1;
        }
        .viewer-close:hover {
            color: #ffffff;
        }

        /* Horizontal image scroll */
        .image-scroll {
            flex: 1;
            min-height: 0;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
        }

        .image-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .image-scroll::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        .image-scroll::-webkit-scrollbar-thumb {
            background: #4a4a6e;
            border-radius: 4px;
        }

        .image-scroll img {
            flex-shrink: 0;
            height: 85%;
            max-height: calc(100vh * 7 / 20 - 80px);
            aspect-ratio: auto;
            border-radius: 6px;
            object-fit: contain;
            background: #0a0a1e;
        }

        .image-timestamp {
            font-size: 0.7rem;
            color: #8080a0;
            text-align: center;
            margin-top: 0.25rem;
        }

        .image-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Loading indicator */
        .loading {
            text-align: center;
            padding: 2rem;
            color: #a0a0c0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #606080;
            font-size: 0.95rem;
        }

        /* ===== Click-to-zoom modal overlay ===== */
        #image-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.92);
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
        }

        #image-modal.visible {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #image-modal img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        #modal-close {
            position: fixed;
            top: 12px;
            right: 16px;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #modal-close:hover {
            background: rgba(80, 80, 120, 0.85);
        }

        /* Mobile tweak: close button a bit larger for touch */
        @media (max-width: 600px) {
            #modal-close {
                top: 8px;
                right: 8px;
                width: 44px;
                height: 44px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <main id="events-area">
        <h1>Event History</h1>
        <div class="subtitle">Recent animal detections from the feeder camera</div>
        <div class="days-scroll">
            <div id="days-row" class="days-row">
                <div class="empty-state">Loading events...</div>
            </div>
        </div>
    </main>

    <div id="image-viewer">
        <div class="viewer-header">
            <h3 id="viewer-title">Event Images</h3>
            <button class="viewer-close" onclick="closeViewer()">&#10005;</button>
        </div>
        <div id="image-scroll" class="image-scroll"></div>
    </div>

    <!-- Click-to-zoom image modal -->
    <div id="image-modal">
        <button id="modal-close" onclick="closeModal(event)">&#10005;</button>
        <img id="modal-image" src="" alt="Full resolution">
    </div>

    <script>
        const INTERVAL_MS = 10_000; // EVT-04 / PERF-02: polling interval <= 10s

        /** Format timestamp string to readable time.
         *  Accepts "YYYYMMDD_HHMMSS" (from /api/events) or ISO date strings.
         */
        function formatTime(ts) {
            if (!ts) return '';
            try {
                let date;
                if (typeof ts === 'string' && /^\d{8}_\d{6}$/.test(ts)) {
                    const y = ts.substring(0, 4);
                    const m = parseInt(ts.substring(4, 6), 10);
                    const d = parseInt(ts.substring(6, 8), 10);
                    const h = parseInt(ts.substring(9, 11), 10);
                    const min = parseInt(ts.substring(11, 13), 10);
                    const s = parseInt(ts.substring(13, 15), 10);
                    date = new Date(y, m - 1, d, h, min, s);
                } else {
                    date = new Date(ts);
                }
                if (isNaN(date.getTime())) return ts;
                let h = date.getHours();
                const m = date.getMinutes();
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
            } catch {
                return ts;
            }
        }

        /** Format full date for a day-group header. */
        function formatDayGroupHeader(dateStr) {
            if (!dateStr || dateStr.length !== 8) return dateStr;
            try {
                const y = parseInt(dateStr.substring(0, 4), 10);
                const m = parseInt(dateStr.substring(4, 6), 10);
                const d = parseInt(dateStr.substring(6, 8), 10);
                const date = new Date(y, m - 1, d);
                if (isNaN(date.getTime())) return dateStr;
                const monthName = date.toLocaleDateString(undefined, { month: 'long' });
                const dayNum = date.getDate();
                return { monthName, dayNum };
            } catch {
                return null;
            }
        }

        /** Map animal name to emoji icon. */
        function getAnimalIcon(animal) {
            const a = (animal || '').toLowerCase();
            if (/cat|persian|tabby|kitten/.test(a)) return '🐱';   // cat
            if (/dog|puppy|hound/.test(a)) return '🐶';          // dog
            if (/squirrel/.test(a)) return '🐭';                 // mouse (squirrel ≈ rodent)
            if (/raccoon|racoon/.test(a)) return '🦝';           // raccoon
            if (/opossum/.test(a)) return '🐾';                  // paw print for opossum
            if (/ferret|weasel|marten|otter/.test(a)) return '🐄';   // mammal
            if (/bird|finch|sparrow|crow|raven/.test(a)) return '🐦';  // bird
            if (/mouse|rodent|mice|rat/.test(a)) return '🐭';      // mouse
            if (/insect|bee|wasp|fly/.test(a)) return '🦋';     // butterfly
            // Generic animal silhouette (no exact match)
            return '🦊';   // fox (wild-animal generic)
        }

        /** Map arm state to open/close icon. */
        function getArmIcon(action) {
            if (!action) return '?';
            const a = action.toLowerCase();
            if (/(open|opened)/.test(a)) return '🔓';  // unlocked padlock = OPEN
            if (/(close|closed)/.test(a)) return '🔒'; // locked padlock = CLOSED
            return '&#9850;';
        }

        /** Render events from /api/events JSON into the days row. */
        function renderEvents(events) {
            const daysRow = document.getElementById('days-row');

            if (!events || events.length === 0) {
                daysRow.innerHTML = '<div class="empty-state">No events found.</div>';
                return;
            }

            // Group events by date (events are already sorted newest-first)
            const dayGroups = new Map();
            for (const entry of events) {
                let dateKey = null;
                if (entry.type === 'arm') {
                    dateKey = entry.timestamp ? entry.timestamp.substring(0, 8) : null;
                } else {
                    dateKey = entry.start_ts ? entry.start_ts.substring(0, 8) : null;
                }
                if (!dateKey) continue;

                const info = formatDayGroupHeader(dateKey);
                if (info) {
                    if (!dayGroups.has(dateKey)) {
                        dayGroups.set(dateKey, { ...info, events: [] });
                    }
                }
                dayGroups.get(dateKey).events.push(entry);
            }

            // Iterate day groups in reverse (oldest date first for reading order)
            const sortedKeys = Array.from(dayGroups.keys()).sort();

            const htmlParts = [];
            sortedKeys.forEach((dateKey) => {
                const group = dayGroups.get(dateKey);
                const monthName = group.monthName;
                const dayNum = group.dayNum;

                htmlParts.push(
                    '<div class="day-group">' +
                    '  <div class="day-header">' +
                    '    <span class="day-num">' + dayNum + '</span>' +
                    '    <span class="month-year">' + monthName + '</span>' +
                    '  </div>' +
                    '  <div class="day-events"><div class="events-spine">'
                );

                group.events.forEach(entry => {
                    if (entry.type === 'arm') {
                        const armIcon = getArmIcon(entry.action);
                        htmlParts.push(
                            '<div class="event-row arm-action">' +
                            '  <span class="event-dot"></span>' +
                            '  <span class="event-icon">' + armIcon + '</span>' +
                            '  <span class="arm-label">' + entry.action + '</span>' +
                            '  <span class="event-time">' + formatTime(entry.timestamp) + '</span>' +
                            '</div>'
                        );
                    } else {
                        const animalLower = (entry.animal || '').toLowerCase();
                        const isOpossum = /opossum/.test(animalLower);
                        const isRaccoon = /raccoon|racoon/.test(animalLower);
                        const isFerret = /ferret/.test(animalLower);
                        const highlight = (isOpossum || isRaccoon || isFerret) ? ' highlight' : '';
                        const iconHtml = isOpossum
                            ? '<img src="/opossum-icon.jpg" alt="opossum" class="animal-icon" width="24" height="24">'
                            : getAnimalIcon(entry.animal);
                        htmlParts.push(
                            '<div class="event-row animal-event' + highlight + '" data-id="' + entry.id + '" data-start="' + entry.start_ts + '" data-end="' + entry.end_ts + '">' +
                            '  <span class="event-dot"></span>' +
                            '  <span class="event-icon">' + iconHtml + '</span>' +
                            '  <span class="event-animal">' + entry.animal.toUpperCase() + '</span>' +
                            '  &nbsp;' + formatTime(entry.start_ts) + '&rarr;' + formatTime(entry.end_ts) +
                            '  &nbsp;<span class="img-count">' + entry.event_count + ' photos</span>' +
                            '</div>'
                        );
                    }
                });

                htmlParts.push(
                    '  </div></div></div>'
                );
            });

            daysRow.innerHTML = htmlParts.join('\n');

            // Attach click handlers to animal event cards
            const rows = daysRow.querySelectorAll('.event-row.animal-event');
            rows.forEach(row => {
                row.addEventListener('click', function () {
                    showImageViewer(
                        this.getAttribute('data-id'),
                        this.getAttribute('data-start'),
                        this.getAttribute('data-end')
                    );
                });
            });
        }

        /** Load images for an event into the bottom viewer panel. */
        let currentExpandedId = null;

        async function showImageViewer(dateStr, startTs, endTs) {
            const viewer = document.getElementById('image-viewer');
            const scroll = document.getElementById('image-scroll');
            const title = document.getElementById('viewer-title');

            if (currentExpandedId === dateStr) {
                // Toggle off
                viewer.classList.remove('visible');
                currentExpandedId = null;
                return;
            }

            // Use composite key so same-date different events are tracked separately
            const eventKey = dateStr + '|' + startTs + '|' + endTs;
            if (currentExpandedId === eventKey) {
                viewer.classList.remove('visible');
                currentExpandedId = null;
                return;
            }

            currentExpandedId = eventKey;
            scroll.innerHTML = '';
            title.textContent = 'Event Images — ' + dateStr;
            viewer.classList.add('visible');

            // Scroll to the left (earliest images) when opening a new event
            scroll.scrollLeft = 0;

            try {
                const resp = await fetch('/api/event/images/' + encodeURIComponent(dateStr));
                const data = await resp.json();

                if (!data.images || data.images.length === 0) {
                    scroll.innerHTML = '<p style="padding:1rem;color:#8080a0;">No images available for this date.</p>';
                    return;
                }

                // Filter images to event's time range (startTs >= entry.start_ts && endTs <= entry.end_ts)
                const filtered = data.images.filter(img => {
                    if (!startTs || !endTs) return true; // no bounds = show all
                    return img.timestamp >= startTs && img.timestamp <= endTs;
                });

                if (filtered.length === 0) {
                    scroll.innerHTML = '<p style="padding:1rem;color:#8080a0;">No images available for this event.</p>';
                    return;
                }

                // Build image columns — sorted by timestamp (earliest first), left to right
                filtered.forEach(img => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'image-wrapper';

                    const imgEl = document.createElement('img');
                    imgEl.src = '/api/event/image/' + encodeURIComponent(img.name);
                    imgEl.alt = img.name;
                    imgEl.loading = 'lazy';
                    imgEl.title = img.name;
                    imgEl.style.cursor = 'zoom-in';

                    // Click to open full-resolution modal
                    imgEl.addEventListener('click', function (e) {
                        e.stopPropagation();
                        openModal('/api/event/image/' + encodeURIComponent(img.name));
                    });

                    const tsEl = document.createElement('div');
                    tsEl.className = 'image-timestamp';
                    tsEl.textContent = formatTime(img.timestamp);

                    wrapper.appendChild(imgEl);
                    wrapper.appendChild(tsEl);
                    scroll.appendChild(wrapper);
                });
            } catch (err) {
                scroll.innerHTML = '<p style="padding:1rem;color:#ff5252;">Failed to load event images.</p>';
            }
        }

        /** Close the image viewer panel. */
        function closeViewer() {
            document.getElementById('image-viewer').classList.remove('visible');
            currentExpandedId = null;
        }

        /* ==========================================
         *  Click-to-zoom modal overlay
         * ========================================== */

        /** Open full-resolution image in a modal overlay. */
        function openModal(imageUrl) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-image');
            img.src = imageUrl;
            modal.classList.add('visible');
            // Prevent body scroll while modal is open
            document.body.style.overflow = 'hidden';
        }

        /** Close the modal when clicking backdrop or close button. */
        function closeModal(e) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-image');
            // Only close on backdrop (img itself is transparent to clicks) or button
            if (e.target === modal || e.target.id === 'modal-close') {
                modal.classList.remove('visible');
                img.src = '';
                document.body.style.overflow = '';
            }
        }

        // Escape key also closes the modal
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('image-modal');
                if (modal.classList.contains('visible')) {
                    closeModal({ target: modal });
                }
            }
        });

        /* ==========================================
         *  Context-preserving polling
         * ========================================== */

        // State preservation variables
        let cachedEvents = [];         // Previous poll result for diff comparison
        let savedScrollLeft = {};      // Per-day-group scroll positions
        let expandedEventId = null;    // Currently expanded event date (for toggle check)
        let expandedStartTs = null;    // start timestamp of expanded event
        let expandedEndTs = null;      // end timestamp of expanded event

        /** Save day-group horizontal scroll positions before DOM update. */
        function saveContext() {
            const rows = document.querySelectorAll('.day-events');
            rows.forEach((el, i) => {
                savedScrollLeft[i] = el.scrollLeft;
            });
            const viewer = document.getElementById('image-viewer');
            if (viewer.classList.contains('visible') && currentExpandedId) {
                expandedEventId = currentExpandedId.split('|')[0];
                expandedStartTs = currentExpandedId.split('|')[1];
                expandedEndTs = currentExpandedId.split('|')[2];
            } else {
                expandedEventId = null;
            }
        }

        /** Restore day-group scroll positions after DOM update. */
        function restoreContext() {
            Object.keys(savedScrollLeft).forEach(i => {
                const el = document.querySelectorAll('.day-events')[i];
                if (el) el.scrollLeft = savedScrollLeft[i];
            });
            savedScrollLeft = {};
        }

        /** Check if new events exist by comparing IDs against cache. */
        function hasNewEvents(newEvents) {
            const cachedIds = new Set(cachedEvents.map(e => e.id));
            return newEvents.some(e => !cachedIds.has(e.id));
        }

        /** Fetch /api/events and update timeline with diff-based logic. */
        async function pollEvents() {
            saveContext();

            try {
                const resp = await fetch('/api/events');
                const newEvents = await resp.json();

                if (hasNewEvents(newEvents)) {
                    renderEvents(newEvents);

                    // Restore viewer for expanded event if it still exists in new data
                    if (expandedEventId) {
                        const stillExists = newEvents.some(e => e.id === expandedEventId);
                        if (stillExists) {
                            showImageViewer(expandedEventId, expandedStartTs, expandedEndTs);
                        } else {
                            document.getElementById('image-viewer').classList.remove('visible');
                        }
                    }

                    cachedEvents = newEvents;
                }
            } catch (err) {
                console.error('Failed to fetch events:', err);
            } finally {
                restoreContext();
            }
        }

        // Start polling after initial empty render
        renderEvents([]);   // Initial empty state
        pollEvents();       // First immediate fetch + render
        setInterval(pollEvents, INTERVAL_MS);  // Subsequent polls at INTERVAL_MS
    </script>
</body>
</html>
