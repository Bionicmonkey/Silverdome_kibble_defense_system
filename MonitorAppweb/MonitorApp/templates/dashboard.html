<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Dome · Kibble Defender</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
            font-size: 1.8rem;
        }
        .header-logo {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.15);
        }
        .panels-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            max-width: 640px;
            margin: 0 auto 1rem;
        }
        .events-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #00c853;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .events-btn:hover {
            background-color: #00e676;
        }
        .panel h2 {
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        #state-display {
            font-size: 2rem;
            font-weight: bold;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            text-align: center;
        }
        .state-open { background-color: #004d1a; color: #00e676; }
        .state-closed { background-color: #4d0000; color: #ff5252; }
        .state-unknown { background-color: #4d3800; color: #ffab40; }
        #timestamp-display {
            text-align: center;
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #8888a0;
        }
        #camera {
            width: 100%;
            max-width: 640px;
            border-radius: 8px;
            background: #000;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        #image-status {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #8888a0;
        }
        #stale-indicator {
            display: none;
            background-color: #ffab40;
            color: #000;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        @keyframes blink-stale {
            0%, 100% { background-color: #ffab40; }
            50% { background-color: #ffe0a0; }
        }
        #stale-indicator.visible {
            display: block;
            animation: blink-stale 1.2s ease-in-out infinite;
        }
        #image-error {
            display: none;
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: #8888a0;
        }

        /* ===== Click-to-zoom modal overlay ===== */
        #image-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.92);
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y;
        }

        #image-modal.visible {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #image-modal img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        #modal-close {
            position: fixed;
            top: 12px;
            right: 16px;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #modal-close:hover {
            background: rgba(80, 80, 120, 0.85);
        }

        @media (max-width: 600px) {
            #modal-close {
                top: 8px;
                right: 8px;
                width: 44px;
                height: 44px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <h1><img class="header-logo" src="/opossum-photo.jpg" alt="Silver Dome opossum"> Silver Dome Kibble Defender</h1>

    <div id="stale-indicator">&#9888; Data may be stale -- AnimalDetector connection lost</div>

    <div class="panels-row">
        <div class="panel">
            <h2>Arm State</h2>
            <div id="state-display" class="state-unknown">Loading...</div>
            <div id="timestamp-display"></div>
        </div>
        <div class="panel">
            <h2>Events</h2>
            <a href="/events" class="events-btn">&#128339; Open Events</a>
            <div id="last-event-area">
                <div id="last-event-text" style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; color:#8888a0;">No events yet</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h2>Live Camera</h2>
        <img id="camera" src="/snapshot?_=0" alt="Camera snapshot" onerror="showImageError()" onclick="openModal('/snapshot?_=' + Date.now())" style="cursor:zoom-in;">
        <div id="image-status"></div>
    </div>
    <div id="image-error">Camera image unavailable -- check AnimalDetector connection</div>

    <!-- Click-to-zoom image modal -->
    <div id="image-modal">
        <button id="modal-close" onclick="closeModal(event)">&#10005;</button>
        <img id="modal-image" src="" alt="Full resolution">
    </div>

    <script>
        const INTERVAL_MS = 5000;
        const IMAGE_INTERVAL_MS = 2000;
        const STALE_THRESHOLD_MS = 10_000;
        let lastStateUpdate = Date.now();
        let lastImageUpdate = Date.now();

        function showStaleIndicator() {
            const elapsed = Date.now() - Math.min(lastStateUpdate, lastImageUpdate);
            const el = document.getElementById('stale-indicator');
            if (elapsed > STALE_THRESHOLD_MS) {
                el.classList.add('visible');
            } else {
                el.classList.remove('visible');
            }
        }

        function showImageError() {
            document.getElementById('image-error').style.display = 'block';
        }

        function hideImageError() {
            document.getElementById('image-error').style.display = 'none';
        }

        function refreshState() {
            fetch('/api/state')
                .then(r => r.json())
                .then(data => {
                    lastStateUpdate = Date.now();
                    showStaleIndicator();
                    const display = document.getElementById('state-display');
                    const tsDisplay = document.getElementById('timestamp-display');
                    const state = (data.arm_state || 'unknown').toLowerCase();
                    display.textContent = data.arm_state || 'unknown';
                    display.className = 'state-' + (state === 'open' ? 'open' : state === 'closed' ? 'closed' : 'unknown');
                    tsDisplay.textContent = data.timestamp ? new Date(data.timestamp).toLocaleString() : '';
                })
                .catch(err => {
                    console.error('Failed to fetch state:', err);
                });
        }

        function refreshLastEvent() {
            fetch('/api/events')
                .then(r => r.json())
                .then(events => {
                    const el = document.getElementById('last-event-text');
                    if (!el) return;
                    if (!events || events.length === 0) {
                        el.textContent = 'No events yet';
                        return;
                    }
                    // Find the most recent animal event (not arm action)
                    const lastAnimal = events.find(e => e.type !== 'arm');
                    if (lastAnimal) {
                        const icon = getAnimalIcon(lastAnimal.animal);
                        const isOpossum = /opossum/.test((lastAnimal.animal || '').toLowerCase());
                        const iconHtml = isOpossum
                            ? '<img src="/opossum-icon.jpg" alt="opossum" style="width:16px;height:16px;vertical-align:middle;margin-right:2px">'
                            : icon;
                        const timeStr = formatTimeForNav(lastAnimal.start_ts || lastAnimal.timestamp);
                        el.innerHTML = `${iconHtml} ${lastAnimal.animal} · ${timeStr}`;
                    } else {
                        el.textContent = 'No events yet';
                    }
                })
                .catch(err => {
                    console.error('Failed to fetch last event:', err);
                });
        }

        function formatTimeForNav(ts) {
            if (!ts) return '';
            try {
                let date;
                if (typeof ts === 'string' && /^\d{8}_\d{6}$/.test(ts)) {
                    const y = ts.substring(0, 4);
                    const m = parseInt(ts.substring(4, 6), 10);
                    const d = parseInt(ts.substring(6, 8), 10);
                    const h = parseInt(ts.substring(9, 11), 10);
                    const mi = parseInt(ts.substring(11, 13), 10);
                    date = new Date(y, m - 1, d, h, mi);
                } else {
                    date = new Date(ts);
                }
                if (isNaN(date.getTime())) return ts;
                let h = date.getHours();
                const m = date.getMinutes();
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                return h + ':' + (m < 10 ? '0' : '') + m + ampm;
            } catch {
                return ts;
            }
        }

        function refreshImage() {
            lastImageUpdate = Date.now();
            hideImageError();
            showStaleIndicator();

            const camera = document.getElementById('camera');
            const status = document.getElementById('image-status');
            const url = '/snapshot?_=' + Date.now();

            /* Pre-load in an off-screen Image to detect network errors before
               updating the visible element — avoids broken-image icon flash. */
            const preload = new Image();
            let isStale = false;

            preload.onload = function () {
                if (isStale) return;
                camera.src = url;
                status.textContent = 'Updated ' + (Date.now() - lastImageUpdate) + 'ms ago';
            };

            preload.onerror = function () {
                if (isStale) return;
                showImageError();
            };

            preload.src = url;

            /* Safety net — if the image hasn't loaded by the next interval,
               set src directly so the view stays fresh on slow networks. */
            setTimeout(() => {
                isStale = true;   // prevent onload from also setting src (double-swap)
                camera.src = url;
                status.textContent = 'Updated ' + (Date.now() - lastImageUpdate) + 'ms ago';
            }, IMAGE_INTERVAL_MS);
        }

        function getAnimalIcon(animal) {
            const a = (animal || '').toLowerCase();
            if (/cat|persian|tabby|kitten/.test(a)) return '🐱';   // cat
            if (/dog|puppy|hound/.test(a)) return '🐶';          // dog
            if (/squirrel/.test(a)) return '🐭';                 // mouse (≈ rodent)
            if (/raccoon|racoon/.test(a)) return '🦝';           // raccoon
            if (/opossum/.test(a)) return '🐀';                  // sheep (marsupial-like fallback)
            if (/ferret|weasel|marten/.test(a)) return '🐄';    // mammal
            if (/bird|finch|sparrow|crow/.test(a)) return '🐦';  // bird
            if (/mouse|rodent|mice/.test(a)) return '🐭';        // mouse/rat
            // Generic animal silhouette
            return '🦊';   // fox (wild-animal generic)
        }

        /* ==========================================
         *  Click-to-zoom modal overlay
         * ========================================== */

        function openModal(imageUrl) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-image');
            img.src = imageUrl;
            modal.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-image');
            if (e.target === modal || e.target.id === 'modal-close') {
                modal.classList.remove('visible');
                img.src = '';
                document.body.style.overflow = '';
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('image-modal');
                if (modal.classList.contains('visible')) {
                    closeModal({ target: modal });
                }
            }
        });

        refreshState();
        refreshImage();
        refreshLastEvent();
        setInterval(refreshState, INTERVAL_MS);
        setInterval(refreshImage, IMAGE_INTERVAL_MS);
        setInterval(refreshLastEvent, 30_000);
    </script>
</body>
</html>
